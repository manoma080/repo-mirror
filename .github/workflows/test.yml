name: Tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    # The mirror workflow commits its journal and configuration to main; those
    # data-only commits are not code changes and must not queue a test run.
    paths-ignore:
      - failures.json
      - migrations.json
      - config.json
      - config-forgejo.json
      - .failure-journal-in-progress

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Run tests
        run: python -m unittest discover -s tests -v
