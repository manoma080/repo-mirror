name: Mirror repositories

on:
  schedule:
    - cron: '0 */3 * * *'
  workflow_dispatch:
    inputs:
      source_urls:
        description: 'Comma-separated exact source repository URLs, e.g. https://github.com/owner/repo (blank mirrors all)'
        required: false
        type: string
        default: ''
      add_to_config:
        description: 'Save the URLs above to config.json so scheduled runs mirror them too (unticked = one-time mirror only)'
        required: false
        type: boolean
        default: false
      destination_name:
        description: 'Optional destination name (one source URL only)'
        required: false
        type: string
        default: ''
      visibility:
        description: 'Visibility for newly created destinations only'
        required: false
        type: choice
        options:
          - unchanged
          - private
          - public
        default: unchanged
      remove_from_config:
        description: 'Remove URLs from config only; no mirroring'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: repository-mirror
  cancel-in-progress: false

jobs:
  configure:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      configured-sha: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Validate manual options
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          ADD: ${{ inputs.add_to_config }}
          REMOVE: ${{ inputs.remove_from_config }}
          URLS: ${{ inputs.source_urls }}
          DEST: ${{ inputs.destination_name }}
          VISIBILITY: ${{ inputs.visibility }}
        run: |
          set -euo pipefail
          if [[ "$REMOVE" == true && ( "$ADD" == true || -n "$DEST" || "$VISIBILITY" != unchanged && "$VISIBILITY" != "" ) ]]; then
            echo 'Remove cannot be combined with add or destination settings' >&2; exit 1
          fi
          if [[ ( "$ADD" == true || "$REMOVE" == true || -n "$DEST" || "$VISIBILITY" != unchanged && "$VISIBILITY" != "" ) && -z "${URLS//[[:space:]]/}" ]]; then
            echo 'Source URLs are required for these options' >&2; exit 1
          fi
      - name: Update requested repositories in config.json
        id: commit
        if: ${{ github.event_name == 'workflow_dispatch' && (inputs.add_to_config || inputs.remove_from_config) }}
        env:
          REQUESTED_SOURCE_URLS: ${{ inputs.source_urls }}
          REQUESTED_DESTINATION: ${{ inputs.destination_name }}
          REQUESTED_VISIBILITY: ${{ inputs.visibility }}
          REMOVE: ${{ inputs.remove_from_config }}
          DESTINATION_OWNER: ${{ vars.MIRROR_OWNER }}
          MIRROR_APP_ID: ${{ secrets.MIRROR_APP_ID }}
          MIRROR_APP_PRIVATE_KEY: ${{ secrets.MIRROR_APP_PRIVATE_KEY }}
          MIRROR_TIMESTAMP_SECRET: ${{ secrets.MIRROR_TIMESTAMP_SECRET }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GITHUB_TOKEN_VALUE: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git check-ref-format "refs/heads/$DEFAULT_BRANCH"
          test ! -L config.json
          args=(--config config.json --urls "$REQUESTED_SOURCE_URLS" --destination "$REQUESTED_DESTINATION" --visibility "$REQUESTED_VISIBILITY")
          if [[ "$REMOVE" == true ]]; then args+=(--remove); else args+=(--auto-pin); fi
          python -m repo_mirror.adhoc "${args[@]}"
          if git diff --quiet -- config.json; then
            echo "No config change needed"
          else
            git -c core.hooksPath=/dev/null add -- config.json
            git -c core.hooksPath=/dev/null -c user.name=repo-mirror -c user.email=repo-mirror@users.noreply.github.com commit -m "Add mirror sources from manual run"
            export GIT_CONFIG_COUNT=1
            export GIT_CONFIG_KEY_0=http.https://github.com/.extraheader
            export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $(printf '%s' "x-access-token:$GITHUB_TOKEN_VALUE" | base64 -w0)"
            git -c core.hooksPath=/dev/null push origin "HEAD:refs/heads/$DEFAULT_BRANCH"
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  test:
    needs: configure
    runs-on: ubuntu-latest
    outputs:
      tested-sha: ${{ steps.revision.outputs.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Test the commit produced by configure (or the default branch head when nothing was added).
          ref: ${{ needs.configure.outputs.configured-sha || github.event.repository.default_branch }}
          persist-credentials: false
      - name: Record tested revision
        id: revision
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Run tests
        run: python -m unittest discover -s tests -v

  mirror:
    needs: test
    if: ${{ !inputs.remove_from_config }}
    # Checks out tested-sha, which already contains any config.json commit made above.
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.test.outputs.tested-sha }}
          persist-credentials: false
      - name: Refresh migration journal
        # migrations.json is the durable intent of any unfinished destination
        # rename. Read the newest published copy before the rename phase so the
        # local file and the Contents API agree on what is pending.
        env:
          MANAGEMENT_TOKEN: ${{ github.token }}
          MANAGEMENT_BRANCH: ${{ github.event.repository.default_branch }}
        shell: bash
        run: |
          set -euo pipefail
          git check-ref-format "refs/heads/$MANAGEMENT_BRANCH"
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0=http.https://github.com/.extraheader
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $(printf '%s' "x-access-token:$MANAGEMENT_TOKEN" | base64 -w0)"
          git fetch --no-tags origin "$MANAGEMENT_BRANCH"
          if git cat-file -e "origin/$MANAGEMENT_BRANCH:migrations.json" 2>/dev/null; then
            git show "origin/$MANAGEMENT_BRANCH:migrations.json" > migrations.json
          fi
      - name: Mirror
        env:
          DESTINATION_OWNER: ${{ vars.MIRROR_OWNER }}
          MIRROR_SOURCE_URLS: ${{ inputs.source_urls }}
          MIRROR_DESTINATION_NAME: ${{ inputs.destination_name }}
          MIRROR_VISIBILITY: ${{ inputs.visibility || 'unchanged' }}
          MIRROR_APP_ID: ${{ secrets.MIRROR_APP_ID }}
          MIRROR_APP_PRIVATE_KEY: ${{ secrets.MIRROR_APP_PRIVATE_KEY }}
          MIRROR_TIMESTAMP_SECRET: ${{ secrets.MIRROR_TIMESTAMP_SECRET }}
          # Journal and configuration writes go through the Contents API with
          # conditional blob-sha writes, so the run needs contents write on the
          # management repository it is itself running in.
          MIRROR_MANAGEMENT_REPOSITORY: ${{ github.repository }}
          MIRROR_MANAGEMENT_TOKEN: ${{ github.token }}
        run: python mirror.py --config config.json --failures failures.json
      - name: Save migration journal
        if: ${{ always() }}
        env:
          MANAGEMENT_TOKEN: ${{ github.token }}
          MANAGEMENT_BRANCH: ${{ github.event.repository.default_branch }}
        shell: bash
        run: |
          set -euo pipefail
          test ! -L migrations.json
          if [ ! -f migrations.json ]; then exit 0; fi
          git check-ref-format "refs/heads/$MANAGEMENT_BRANCH"
          base=$(git rev-parse HEAD)
          git -c core.hooksPath=/dev/null add -- migrations.json
          if git diff --cached --quiet; then exit 0; fi
          git -c core.hooksPath=/dev/null -c user.name=repo-mirror -c user.email=repo-mirror@localhost commit -m 'Update mirror migration journal'
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0=http.https://github.com/.extraheader
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $(printf '%s' "x-access-token:$MANAGEMENT_TOKEN" | base64 -w0)"
          # Lease-checked: this only lands if the branch is still at the commit
          # the run started from. A concurrent writer's journal is never
          # overwritten; the run fails instead of losing a pending rename.
          git -c core.hooksPath=/dev/null push --force-with-lease="refs/heads/$MANAGEMENT_BRANCH:$base" origin "HEAD:refs/heads/$MANAGEMENT_BRANCH"
      - name: Save failure journal
        if: ${{ always() }}
        env:
          MANAGEMENT_TOKEN: ${{ github.token }}
          MANAGEMENT_BRANCH: ${{ github.event.repository.default_branch }}
        shell: bash
        run: |
          set -euo pipefail
          test ! -L failures.json
          if [ ! -f failures.json ]; then exit 0; fi
          git check-ref-format "refs/heads/$MANAGEMENT_BRANCH"
          git -c core.hooksPath=/dev/null add -- failures.json
          if git diff --cached --quiet; then exit 0; fi
          git -c core.hooksPath=/dev/null -c user.name=repo-mirror -c user.email=repo-mirror@users.noreply.github.com commit -m 'Update asset failure journal'
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0=http.https://github.com/.extraheader
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$MANAGEMENT_TOKEN" | base64 -w0)"
          git -c core.hooksPath=/dev/null push origin "HEAD:refs/heads/$MANAGEMENT_BRANCH"
