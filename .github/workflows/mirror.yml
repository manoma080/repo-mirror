name: Mirror repositories

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repository-mirror
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    outputs:
      tested-sha: ${{ steps.revision.outputs.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Record tested revision
        id: revision
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Run tests
        run: python -m unittest discover -s tests -v

  mirror:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.test.outputs.tested-sha }}
          persist-credentials: false
      - name: Create GitHub App installation token
        id: app-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        with:
          app-id: ${{ secrets.MIRROR_APP_ID }}
          private-key: ${{ secrets.MIRROR_APP_PRIVATE_KEY }}
          owner: ${{ vars.MIRROR_OWNER }}
      - name: Mirror
        env:
          DESTINATION_OWNER: ${{ vars.MIRROR_OWNER }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: python mirror.py --config config.json --failures failures.json
      - name: Save failure journal
        if: ${{ always() && steps.app-token.outcome == 'success' }}
        env:
          MANAGEMENT_TOKEN: ${{ github.token }}
          MANAGEMENT_BRANCH: ${{ github.event.repository.default_branch }}
        shell: bash
        run: |
          set -euo pipefail
          test ! -L failures.json
          if [ ! -f failures.json ]; then exit 0; fi
          git check-ref-format "refs/heads/$MANAGEMENT_BRANCH"
          git -c core.hooksPath=/dev/null add -- failures.json
          if git diff --cached --quiet; then exit 0; fi
          git -c core.hooksPath=/dev/null -c user.name=repo-mirror -c user.email=repo-mirror@users.noreply.github.com commit -m 'Update asset failure journal'
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0=http.https://github.com/.extraheader
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$MANAGEMENT_TOKEN" | base64 -w0)"
          git -c core.hooksPath=/dev/null push origin "HEAD:refs/heads/$MANAGEMENT_BRANCH"
