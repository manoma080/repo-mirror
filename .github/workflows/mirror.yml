name: Mirror repositories

on:
  schedule:
    - cron: '0 */3 * * *'
  workflow_dispatch:
    inputs:
      source_urls:
        description: 'Comma-separated exact source repository URLs, e.g. https://github.com/owner/repo (blank mirrors all)'
        required: false
        type: string
        default: ''
      add_to_config:
        description: 'Save the URLs above to config.json so scheduled runs mirror them too (unticked = one-time mirror only)'
        required: false
        type: boolean
        default: false
      destination_name:
        description: 'Optional destination name (one source URL only)'
        required: false
        type: string
        default: ''
      visibility:
        description: 'Visibility for newly created destinations only'
        required: false
        type: choice
        options:
          - unchanged
          - private
          - public
        default: unchanged
      remove_from_config:
        description: 'Remove URLs from config only; no mirroring'
        required: false
        type: boolean
        default: false
      ignore_releases:
        description: 'Ignore releases for these URLs (keep = use each saved repository setting)'
        required: false
        type: choice
        options:
          - keep
          - 'true'
          - 'false'
        default: keep

permissions:
  contents: read

concurrency:
  group: repository-mirror
  cancel-in-progress: false

jobs:
  configure:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      configured-sha: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: ./.github/actions/mirror-token
        id: auth
        with:
          app-id: ${{ secrets.MIRROR_APP_ID }}
          private-key: ${{ secrets.MIRROR_APP_PRIVATE_KEY }}
          owner: ${{ vars.MIRROR_OWNER }}
          account-type: ${{ vars.MIRROR_ACCOUNT_TYPE || 'personal' }}
      - name: Validate management branch
        env:
          MANAGEMENT_BRANCH: ${{ github.event.repository.default_branch }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$MANAGEMENT_BRANCH" != main ]; then
            echo 'Management default branch must be main' >&2; exit 1
          fi
      - name: Validate manual options
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          ADD: ${{ inputs.add_to_config }}
          REMOVE: ${{ inputs.remove_from_config }}
          URLS: ${{ inputs.source_urls }}
          DEST: ${{ inputs.destination_name }}
          VISIBILITY: ${{ inputs.visibility }}
          IGNORE: ${{ inputs.ignore_releases || 'keep' }}
        run: |
          set -euo pipefail
          if [[ "$REMOVE" == true && ( "$ADD" == true || -n "$DEST" || "$VISIBILITY" != unchanged && "$VISIBILITY" != "" || "$IGNORE" != keep ) ]]; then
            echo 'Remove cannot be combined with add or destination settings' >&2; exit 1
          fi
          if [[ ( "$ADD" == true || "$REMOVE" == true || -n "$DEST" || "$VISIBILITY" != unchanged && "$VISIBILITY" != "" || "$IGNORE" != keep ) && -z "${URLS//[[:space:]]/}" ]]; then
            echo 'Source URLs are required for these options' >&2; exit 1
          fi
      - name: Update requested repositories in config.json
        id: commit
        if: ${{ github.event_name == 'workflow_dispatch' && (inputs.add_to_config || inputs.remove_from_config) }}
        env:
          REQUESTED_SOURCE_URLS: ${{ inputs.source_urls }}
          REQUESTED_DESTINATION: ${{ inputs.destination_name }}
          REQUESTED_VISIBILITY: ${{ inputs.visibility }}
          REQUESTED_IGNORE_RELEASES: ${{ inputs.ignore_releases || 'keep' }}
          REMOVE: ${{ inputs.remove_from_config }}
          DESTINATION_OWNER: ${{ vars.MIRROR_OWNER }}
          MIRROR_APP_ID: ${{ secrets.MIRROR_APP_ID }}
          MIRROR_APP_PRIVATE_KEY: ${{ secrets.MIRROR_APP_PRIVATE_KEY }}
          MIRROR_TIMESTAMP_SECRET: ${{ secrets.MIRROR_TIMESTAMP_SECRET }}
          MIRROR_GITLAB_TOKEN: ${{ secrets.MIRROR_GITLAB_TOKEN }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GITHUB_TOKEN_VALUE: ${{ steps.auth.outputs.token }}
        shell: bash
        run: |
          set -euo pipefail
          git check-ref-format "refs/heads/$DEFAULT_BRANCH"
          test ! -L config.json
          args=(--config config.json --urls "$REQUESTED_SOURCE_URLS" --destination "$REQUESTED_DESTINATION" --visibility "$REQUESTED_VISIBILITY" --ignore-releases "$REQUESTED_IGNORE_RELEASES")
          if [[ "$REMOVE" == true ]]; then args+=(--remove); else args+=(--auto-pin); fi
          python -m repo_mirror.adhoc "${args[@]}"
          if git diff --quiet -- config.json; then
            echo "No config change needed"
          else
            git -c core.hooksPath=/dev/null add -- config.json
            git -c core.hooksPath=/dev/null -c user.name=repo-mirror -c user.email=repo-mirror@users.noreply.github.com commit -m "Add mirror sources from manual run"
            export GIT_CONFIG_COUNT=1
            export GIT_CONFIG_KEY_0=http.https://github.com/.extraheader
            export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $(printf '%s' "x-access-token:$GITHUB_TOKEN_VALUE" | base64 -w0)"
            git -c core.hooksPath=/dev/null push origin "HEAD:refs/heads/$DEFAULT_BRANCH"
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  mirror:
    needs: configure
    if: ${{ !inputs.remove_from_config }}
    # Checks out configured-sha, which already contains any config.json commit made above.
    # Tests run in .github/workflows/test.yml on pull requests and pushes to main.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.configure.outputs.configured-sha || github.event.repository.default_branch }}
          persist-credentials: false
      - uses: ./.github/actions/mirror-token
        id: auth
        with:
          app-id: ${{ secrets.MIRROR_APP_ID }}
          private-key: ${{ secrets.MIRROR_APP_PRIVATE_KEY }}
          owner: ${{ vars.MIRROR_OWNER }}
          account-type: ${{ vars.MIRROR_ACCOUNT_TYPE || 'personal' }}
      - name: Refresh failure journal
        # Migration intents are managed by the Contents API. Refresh the
        # failure journal separately before the CLI reads it.
        env:
          MANAGEMENT_TOKEN: ${{ steps.auth.outputs.token }}
          MANAGEMENT_BRANCH: ${{ github.event.repository.default_branch }}
        shell: bash
        run: |
          set -euo pipefail
          git check-ref-format "refs/heads/$MANAGEMENT_BRANCH"
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0=http.https://github.com/.extraheader
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $(printf '%s' "x-access-token:$MANAGEMENT_TOKEN" | base64 -w0)"
          git fetch --no-tags origin "$MANAGEMENT_BRANCH"
          # Publish a durable fence BEFORE any mirror side effects. A canceled
          # runner, failed upload, or failed save leaves it for operator recovery.
          current=$(git rev-parse "origin/$MANAGEMENT_BRANCH")
          # Admission checks the tested blob at the fetched branch tip. Writers
          # that do not honor this fence can still change config after admission.
          tested_config=$(git rev-parse 'HEAD:config.json')
          current_config=$(git rev-parse "$current:config.json")
          if [ "$tested_config" != "$current_config" ]; then
            echo 'Config changed since testing; refusing mirror' >&2; exit 1
          fi
          if git cat-file -e "$current:.failure-journal-in-progress" 2>/dev/null; then
            echo 'Unresolved failure journal run; reconcile before mirroring' >&2; exit 1
          fi
          marker=$(printf '%s/%s\n' "${GITHUB_RUN_ID:-local}" "${GITHUB_RUN_ATTEMPT:-1}" | git hash-object -w --stdin)
          printf '%s\n' "$marker" > "$RUNNER_TEMP/failure-journal-marker"
          export GIT_INDEX_FILE="$RUNNER_TEMP/failure-journal-acquire-index"
          rm -f "$GIT_INDEX_FILE"
          git read-tree "$current"
          git update-index --add --cacheinfo "100644,$marker,.failure-journal-in-progress"
          tree=$(git write-tree)
          commit=$(printf '%s\n' 'Fence mirror failure journal' | git -c user.name=repo-mirror -c user.email=repo-mirror@users.noreply.github.com commit-tree "$tree" -p "$current")
          git -c core.hooksPath=/dev/null push --force-with-lease="refs/heads/$MANAGEMENT_BRANCH:$current" origin "$commit:refs/heads/$MANAGEMENT_BRANCH"
          unset GIT_INDEX_FILE
          # Use the exact journal at the fenced revision as our base.
          test ! -L failures.json
          if git cat-file -e "origin/$MANAGEMENT_BRANCH:failures.json" 2>/dev/null; then
            git show "origin/$MANAGEMENT_BRANCH:failures.json" > failures.json
            git rev-parse "origin/$MANAGEMENT_BRANCH:failures.json" > "$RUNNER_TEMP/failure-journal-base"
          else
            rm -f failures.json
            printf '%s\n' missing > "$RUNNER_TEMP/failure-journal-base"
          fi
      - name: Mirror
        id: mirror-run
        env:
          DESTINATION_OWNER: ${{ vars.MIRROR_OWNER }}
          MIRROR_SOURCE_URLS: ${{ inputs.source_urls }}
          MIRROR_DESTINATION_NAME: ${{ inputs.destination_name }}
          MIRROR_VISIBILITY: ${{ inputs.visibility || 'unchanged' }}
          # A saved configuration governs when add_to_config persists the choice.
          MIRROR_IGNORE_RELEASES: ${{ (inputs.add_to_config && 'keep') || inputs.ignore_releases || 'keep' }}
          MIRROR_APP_ID: ${{ secrets.MIRROR_APP_ID }}
          MIRROR_APP_PRIVATE_KEY: ${{ secrets.MIRROR_APP_PRIVATE_KEY }}
          MIRROR_TIMESTAMP_SECRET: ${{ secrets.MIRROR_TIMESTAMP_SECRET }}
          # Journal and configuration writes go through the Contents API with
          # conditional blob-sha writes, using the workflow's minted installation
          # token rather than the job-scoped GITHUB_TOKEN.
          MIRROR_MANAGEMENT_REPOSITORY: ${{ github.repository }}
          MIRROR_MANAGEMENT_TOKEN: ${{ steps.auth.outputs.token }}
        run: python mirror.py --config config.json --failures failures.json
      # Migration transactions publish their journal directly through the API;
      # never push a stale local migrations.json over that authoritative state.
      - name: Prepare failure journal recovery
        id: prepare-journal
        if: ${{ always() && steps.mirror-run.outcome != 'skipped' && steps.mirror-run.outcome != '' }}
        shell: bash
        run: |
          set -euo pipefail
          # Snapshot just the regular journal, before any fallible git operation.
          # Artifacts are readable by repository readers, like the journal itself.
          python -c 'import os, stat, shutil
          try:
              fd = os.open("failures.json", os.O_RDONLY | os.O_NOFOLLOW | os.O_NONBLOCK)
          except FileNotFoundError:
              raise SystemExit(0)
          with os.fdopen(fd, "rb") as src:
              if not stat.S_ISREG(os.fstat(src.fileno()).st_mode):
                  raise SystemExit("failure journal is not a regular file")
              directory = os.path.join(os.environ["RUNNER_TEMP"], "failure-journal-recovery")
              os.mkdir(directory, 0o700)
              with open(os.path.join(directory, "failures.json"), "xb") as dst:
                  shutil.copyfileobj(src, dst)
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write("present=true\n")'
      - name: Save failure journal
        id: save-journal
        if: ${{ always() }}
        env:
          MANAGEMENT_TOKEN: ${{ steps.auth.outputs.token }}
          MANAGEMENT_BRANCH: ${{ github.event.repository.default_branch }}
          PREPARE_OUTCOME: ${{ steps.prepare-journal.outcome }}
          JOURNAL_PRESENT: ${{ steps.prepare-journal.outputs.present }}
          MIRROR_OUTCOME: ${{ steps.mirror-run.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          # Cancellation or an unknown outcome can interrupt journal writes.
          # A cancelled or unknown step outcome can interrupt journal writes.
          if [ "${MIRROR_OUTCOME:-}" != success ] && [ "${MIRROR_OUTCOME:-}" != failure ]; then
            echo 'Mirror canceled or outcome unknown; retaining fence' >&2; exit 1
          fi
          if [ "${PREPARE_OUTCOME:-}" != success ]; then exit 0; fi
          git check-ref-format "refs/heads/$MANAGEMENT_BRANCH"
          base=$(<"$RUNNER_TEMP/failure-journal-base")
          if [ "${JOURNAL_PRESENT:-false}" = true ]; then
            local_blob=$(git hash-object -w -- "$RUNNER_TEMP/failure-journal-recovery/failures.json")
          elif [ "$base" != missing ]; then
            echo 'Existing failure journal disappeared; retaining fence' >&2; exit 1
          fi
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0=http.https://github.com/.extraheader
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $(printf '%s' 'x-access-token:'"$MANAGEMENT_TOKEN" | base64 -w0)"
          git fetch --no-tags origin "$MANAGEMENT_BRANCH"
          current=$(git rev-parse "origin/$MANAGEMENT_BRANCH")
          if git cat-file -e "$current:failures.json" 2>/dev/null; then
            remote_blob=$(git rev-parse "$current:failures.json")
          else
            remote_blob=missing
          fi
          if [ "$remote_blob" != "$base" ]; then
            echo 'Failure journal changed concurrently; refusing overwrite' >&2; exit 1
          fi
          marker=$(<"$RUNNER_TEMP/failure-journal-marker")
          if [ "$(git rev-parse "$current:.failure-journal-in-progress" 2>/dev/null || :)" != "$marker" ]; then
            echo 'Failure journal fence changed; refusing overwrite' >&2; exit 1
          fi
          # Build on the freshly fetched tree without touching the tested checkout.
          export GIT_INDEX_FILE="$RUNNER_TEMP/failure-journal-index"
          rm -f "$GIT_INDEX_FILE"
          git read-tree "$current"
          if [ "${JOURNAL_PRESENT:-false}" = true ]; then
            git update-index --add --cacheinfo "100644,$local_blob,failures.json"
          fi
          git update-index --force-remove .failure-journal-in-progress
          tree=$(git write-tree)
          commit=$(printf '%s\n' 'Update asset failure journal' | git -c user.name=repo-mirror -c user.email=repo-mirror@users.noreply.github.com commit-tree "$tree" -p "$current")
          git -c core.hooksPath=/dev/null push --force-with-lease="refs/heads/$MANAGEMENT_BRANCH:$current" origin "$commit:refs/heads/$MANAGEMENT_BRANCH"
      # A lost runner may never upload an artifact. Reconcile destination state
      # and the durable journal manually before removing an unresolved fence.
      - name: Upload failure journal recovery
        if: ${{ always() && steps.save-journal.outcome == 'failure' && steps.prepare-journal.outputs.present == 'true' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: failure-journal-recovery-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/failure-journal-recovery/failures.json
          if-no-files-found: error
          retention-days: 7
