name: Mirror to local Forgejo
on:
  schedule:
    - cron: '0 0,6,12,18 * * *'
      timezone: Europe/Helsinki
  workflow_dispatch:
    inputs:
      # Forgejo sorts these keys alphabetically in the dispatch form.
      input_01_source_urls:
        description: 'Comma-separated source URLs (blank mirrors all)'
        required: false
        type: string
        default: ''
      input_02_add_to_config:
        description: 'Save these URLs to config.json in repo-mirror-control-config (unticked = one-time mirror only)'
        required: false
        type: boolean
        default: false
      input_03_destination_name:
        description: 'Optional destination name (one source URL only)'
        required: false
        type: string
        default: ''
      input_04_visibility:
        description: 'Visibility for newly created destinations only'
        required: false
        type: choice
        options:
          - unchanged
          - private
          - public
        default: unchanged
      input_05_remove_from_config:
        description: 'Remove URLs from config only; no mirroring'
        required: false
        type: boolean
        default: false
      input_06_ignore_releases:
        description: 'Ignore releases for these URLs (keep = use each saved repository setting)'
        required: false
        type: choice
        options:
          - keep
          - 'true'
          - 'false'
        default: keep
concurrency:
  group: local-forgejo-mirror
  cancel-in-progress: false
jobs:
  mirror:
    runs-on: forgejo-mirror-local
    timeout-minutes: 360
    steps:
      - name: Run installed launcher
        env:
          EVENT: ${{ forgejo.event_name }}
          SOURCE_URLS: ${{ inputs.input_01_source_urls }}
          ADD: ${{ inputs.input_02_add_to_config }}
          REMOVE: ${{ inputs.input_05_remove_from_config }}
          DESTINATION: ${{ inputs.input_03_destination_name }}
          VISIBILITY: ${{ inputs.input_04_visibility }}
          IGNORE_RELEASES: ${{ inputs.input_06_ignore_releases }}
        run: |
          set -eu
          unset FORGEJO_MANUAL_INPUTS
          if [ "$EVENT" = workflow_dispatch ]; then
            FORGEJO_MANUAL_INPUTS=$(python3 -c 'import json,os; e=os.environ; print(json.dumps(dict(source_urls=e["SOURCE_URLS"], add_to_config=e["ADD"].lower()=="true", remove_from_config=e["REMOVE"].lower()=="true", destination_name=e["DESTINATION"], visibility=e["VISIBILITY"] or "unchanged", ignore_releases=e["IGNORE_RELEASES"] or "keep")))')
            export FORGEJO_MANUAL_INPUTS
          fi
          unset SOURCE_URLS ADD REMOVE DESTINATION VISIBILITY IGNORE_RELEASES
          exec run-mirror mirror
